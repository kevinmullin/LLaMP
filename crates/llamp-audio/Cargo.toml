[package]
name = "llamp-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
cpal = "0.18"
libc = "0.2"
lofty = "=0.25.2"
rtrb = "0.3"
rubato = "5.0.0"
rustfft = "6"
symphonia = { version = "0.6", default-features = false, features = ["aac", "aiff", "alac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
symphonia-adapter-libopus = "0.3"

[dev-dependencies]
flacenc = "0.5.1"
mp3lame-encoder = "0.2.5"
ogg = "0.9.2"
opusic-sys = "0.7.5"
vorbis_rs = "0.5.6"
