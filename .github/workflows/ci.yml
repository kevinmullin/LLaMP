name: ci

on:
  push:
  pull_request:

env:
  MACOSX_DEPLOYMENT_TARGET: "26.0"

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - run: cargo test --workspace --locked
      - name: Fail if the checked-in header drifts from cbindgen 0.29.4
        run: |
          cargo install cbindgen --version 0.29.4 --locked
          cbindgen --config crates/llamp-ffi/cbindgen.toml --crate llamp-ffi --output /tmp/llamp.h
          diff -u crates/llamp-ffi/include/llamp.h /tmp/llamp.h
